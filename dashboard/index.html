<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MamaPook — Marketing Dashboard</title>
<style>
  :root {
    color-scheme: light;
    --surface-1: #fcfcfb; --page: #f9f9f7;
    --ink-1: #0b0b0b; --ink-2: #52514e; --ink-muted: #898781;
    --grid: #e1e0d9; --baseline: #c3c2b7; --border: rgba(11,11,11,0.10);
    --s1: #2a78d6; --s2: #1baf7a; --s3: #eda100; --s4: #008300;
    --s5: #4a3aa7; --s6: #e34948; --s7: #e87ba4; --s8: #eb6834;
    --good-text: #006300;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface-1: #1a1a19; --page: #0d0d0d;
      --ink-1: #ffffff; --ink-2: #c3c2b7; --ink-muted: #898781;
      --grid: #2c2c2a; --baseline: #383835; --border: rgba(255,255,255,0.10);
      --s1: #3987e5; --s2: #199e70; --s3: #c98500; --s4: #008300;
      --s5: #9085e9; --s6: #e66767; --s7: #d55181; --s8: #d95926;
      --good-text: #0ca30c;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--page); color: var(--ink-1);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
    padding: 18px 24px 0;
  }
  header h1 { font-size: 18px; }
  .synth-badge {
    font-size: 12px; color: var(--ink-2); border: 1px solid var(--border);
    border-radius: 999px; padding: 2px 10px;
  }
  nav { display: flex; gap: 4px; padding: 10px 24px 0; flex-wrap: wrap; }
  nav button {
    font: inherit; font-size: 13px; color: var(--ink-2); background: none;
    border: none; border-bottom: 2px solid transparent; padding: 6px 10px; cursor: pointer;
  }
  nav button.active { color: var(--ink-1); border-bottom-color: var(--s1); font-weight: 600; }
  main { padding: 16px 24px 48px; max-width: 1200px; }
  section.page { display: none; }
  section.page.active { display: block; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .tile {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px;
  }
  .tile .label { font-size: 12px; color: var(--ink-2); }
  .tile .value { font-size: 26px; font-weight: 650; margin-top: 2px; }
  .tile .delta { font-size: 12px; color: var(--good-text); }
  .card {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px; margin-bottom: 16px; overflow-x: auto;
  }
  .card h2 { font-size: 14px; margin-bottom: 2px; }
  .card .sub { font-size: 12px; color: var(--ink-muted); margin-bottom: 12px; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); margin: 8px 0 4px; }
  .legend span::before {
    content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 2px;
    margin-right: 5px; background: var(--c);
  }
  .controls { display: flex; gap: 6px; margin-bottom: 10px; }
  .controls button {
    font: inherit; font-size: 12px; padding: 4px 12px; cursor: pointer;
    background: none; color: var(--ink-2); border: 1px solid var(--border); border-radius: 999px;
  }
  .controls button.active { color: var(--ink-1); border-color: var(--s1); font-weight: 600; }
  table { border-collapse: collapse; font-size: 13px; width: 100%; }
  th { text-align: left; color: var(--ink-2); font-weight: 600; padding: 6px 10px; border-bottom: 1px solid var(--grid); }
  td { padding: 6px 10px; border-bottom: 1px solid var(--grid); font-variant-numeric: tabular-nums; }
  td.num, th.num { text-align: right; }
  .heat td.cell { text-align: right; min-width: 52px; }
  svg text { fill: var(--ink-muted); font: 11px system-ui, sans-serif; }
  svg .dl { fill: var(--ink-2); font-weight: 600; }
  #tooltip {
    position: fixed; pointer-events: none; display: none; z-index: 10;
    background: var(--surface-1); color: var(--ink-1); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 10px; font-size: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.15);
  }
</style>
</head>
<body>
<header>
  <h1>MamaPook — Marketing Dashboard</h1>
  <span class="synth-badge" id="dataBadge">SYNTHETIC DATA — awaiting POS feed</span>
</header>
<nav id="nav"></nav>
<main id="main"></main>
<div id="tooltip"></div>

<script src="data.js"></script>
<script>
const D = window.MP_DATA, DIMS = window.MP_DIMS;
const SLOT = ['var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--s4)', 'var(--s5)', 'var(--s6)', 'var(--s7)', 'var(--s8)'];
const branchColor = Object.fromEntries(DIMS.BRANCHES.map((b, i) => [b, SLOT[i]]));   // fixed order, never cycled
const channelColor = Object.fromEntries(DIMS.CHANNELS.map((c, i) => [c, SLOT[i]]));
const fmtM = n => (n / 1e6).toFixed(2) + 'M';
const fmtN = n => n.toLocaleString('en-US');

// Sequential blue ramp (light steps 100->700) for heat cells; text stays ink.
const SEQ = ['#cde2fb','#b7d3f6','#9ec5f4','#86b6ef','#6da7ec','#5598e7','#3987e5','#2a78d6','#256abf','#1c5cab','#184f95','#104281','#0d366b'];
function heatColor(v, max) {
  const t = Math.max(0, Math.min(1, v / max));
  return SEQ[Math.round(t * (SEQ.length - 1))];
}
function heatInk(v, max) { return (v / max) > 0.55 ? '#ffffff' : '#0b0b0b'; }

const tooltip = document.getElementById('tooltip');
function tipOn(e, html) {
  tooltip.innerHTML = html; tooltip.style.display = 'block';
  tooltip.style.left = (e.clientX + 12) + 'px'; tooltip.style.top = (e.clientY + 12) + 'px';
}
function tipOff() { tooltip.style.display = 'none'; }

// ---------- pages ----------
const PAGES = [
  { id: 'overview', title: 'Overview', render: renderOverview },
  { id: 'dayparts', title: 'Dayparts', render: renderDayparts },
  { id: 'menu', title: 'Menu & Category', render: renderMenu },
  { id: 'basket', title: 'Basket & Add-on', render: renderBasket },
  { id: 'soon', title: 'Marketing · Social · Reputation', render: renderSoon },
];
const nav = document.getElementById('nav'), main = document.getElementById('main');
PAGES.forEach((p, i) => {
  const b = document.createElement('button');
  b.textContent = p.title;
  b.onclick = () => activate(p.id);
  b.dataset.page = p.id;
  nav.appendChild(b);
  const s = document.createElement('section');
  s.className = 'page'; s.id = 'page-' + p.id;
  main.appendChild(s);
  p.render(s);
});
function activate(id) {
  nav.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.page === id));
  main.querySelectorAll('.page').forEach(s => s.classList.toggle('active', s.id === 'page-' + id));
  if (location.hash !== '#' + id) history.replaceState(null, '', '#' + id);
}
activate(PAGES.some(p => p.id === location.hash.slice(1)) ? location.hash.slice(1) : 'overview');
window.addEventListener('hashchange', () =>
  activate(PAGES.some(p => p.id === location.hash.slice(1)) ? location.hash.slice(1) : 'overview'));

// ---------- Overview ----------
function renderOverview(el) {
  el.innerHTML = `
    <div class="tiles">
      ${tile('Sales (period)', '฿' + fmtN(D.kpi.sales), '+' + D.kpi.vsBaseline + '% vs baseline')}
      ${tile('Transactions', fmtN(D.kpi.transactions))}
      ${tile('Avg basket size', '฿' + D.kpi.abs + ' /bill')}
      ${tile('Branches live', '4')}
    </div>
    <div class="card">
      <h2>Monthly sales by branch</h2>
      <div class="sub">marts.v_monthly_by_branch — agency deck p.4</div>
      <div id="ovLine"></div>
      <div class="legend">${DIMS.BRANCHES.map(b => `<span style="--c:${branchColor[b]}">${b}</span>`).join('')}</div>
    </div>
    <div class="card">
      <h2>Sales contribution by channel, per branch</h2>
      <div class="sub">marts.v_branch_channel — deck p.5–8</div>
      <div id="ovStack"></div>
      <div class="legend">${DIMS.CHANNELS.map(c => `<span style="--c:${channelColor[c]}">${c}</span>`).join('')}</div>
    </div>`;
  lineChart(el.querySelector('#ovLine'), D.monthly);
  stackedBars(el.querySelector('#ovStack'), D.channelMix);
}
function tile(label, value, delta) {
  return `<div class="tile"><div class="label">${label}</div><div class="value">${value}</div>${delta ? `<div class="delta">▲ ${delta}</div>` : ''}</div>`;
}

function lineChart(host, rows) {
  const W = 720, H = 240, P = { l: 44, r: 70, t: 10, b: 24 };
  const maxY = Math.max(...rows.map(r => r.sales)) * 1.15;
  const x = i => P.l + i * (W - P.l - P.r) / (DIMS.MONTHS.length - 1);
  const y = v => H - P.b - v / maxY * (H - P.t - P.b);
  let g = '';
  for (let t = 0; t <= 4; t++) {
    const v = maxY * t / 4, yy = y(v);
    g += `<line x1="${P.l}" x2="${W - P.r}" y1="${yy}" y2="${yy}" stroke="var(--grid)" stroke-width="1"/>
          <text x="${P.l - 6}" y="${yy + 3}" text-anchor="end">${(v / 1e6).toFixed(1)}M</text>`;
  }
  g += DIMS.MONTHS.map((m, i) => `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${m}</text>`).join('');
  const endLabels = [];
  DIMS.BRANCHES.forEach(b => {
    const pts = rows.filter(r => r.branch === b);
    if (!pts.length) return;
    const path = pts.map((r, j) => (j ? 'L' : 'M') + x(DIMS.MONTHS.indexOf(r.month)) + ' ' + y(r.sales)).join(' ');
    g += `<path d="${path}" fill="none" stroke="${branchColor[b]}" stroke-width="2" stroke-linecap="round"/>`;
    pts.forEach(r => {
      g += `<circle cx="${x(DIMS.MONTHS.indexOf(r.month))}" cy="${y(r.sales)}" r="8" fill="transparent"
             onmousemove="tipOn(event, '<b>${b}</b> · ${r.month}<br>฿${fmtN(r.sales)} · ${fmtN(r.transactions)} bills · ABS ฿${r.abs}')"
             onmouseleave="tipOff()"/>
            <circle cx="${x(DIMS.MONTHS.indexOf(r.month))}" cy="${y(r.sales)}" r="2.5" fill="${branchColor[b]}" pointer-events="none"/>`;
    });
    const last = pts[pts.length - 1];
    endLabels.push({ b, x: x(DIMS.MONTHS.indexOf(last.month)) + 8, y: y(last.sales) + 3 });
  });
  // de-overlap end labels: enforce 14px vertical separation
  endLabels.sort((a, b2) => a.y - b2.y);
  for (let i = 1; i < endLabels.length; i++)
    if (endLabels[i].y - endLabels[i - 1].y < 14) endLabels[i].y = endLabels[i - 1].y + 14;
  g += endLabels.map(l => `<text class="dl" x="${l.x}" y="${l.y}">${l.b}</text>`).join('');
  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Monthly sales by branch">${g}</svg>`;
}

function stackedBars(host, mix) {
  const W = 720, H = 210, P = { l: 40, r: 10, t: 8, b: 24 }, bw = 90;
  const step = (W - P.l - P.r) / mix.length;
  let g = '';
  for (let t = 0; t <= 4; t++) {
    const yy = P.t + (H - P.t - P.b) * t / 4;
    g += `<text x="${P.l - 6}" y="${yy + 3}" text-anchor="end">${100 - t * 25}%</text>`;
  }
  mix.forEach((row, i) => {
    const cx = P.l + step * i + step / 2;
    let acc = 0;
    row.values.forEach((v, ci) => {
      const total = row.values.reduce((a, x) => a + x, 0) || 1;
      const hpx = (H - P.t - P.b) * v / total;
      const y0 = H - P.b - (acc + hpx);
      g += `<rect x="${cx - bw / 2}" y="${y0}" width="${bw}" height="${Math.max(hpx - 2, 0)}" rx="2"
              fill="${channelColor[DIMS.CHANNELS[ci]]}"
              onmousemove="tipOn(event, '<b>${row.branch}</b> · ${DIMS.CHANNELS[ci]}<br>${v.toFixed(1)}% of sales')"
              onmouseleave="tipOff()"/>`;
      if (v > 8) g += `<text x="${cx}" y="${y0 + hpx / 2 + 4}" text-anchor="middle" fill="#fff" pointer-events="none">${v.toFixed(0)}%</text>`;
      acc += hpx;
    });
    g += `<text x="${cx}" y="${H - 6}" text-anchor="middle">${row.branch}</text>`;
  });
  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Channel mix per branch">${g}</svg>`;
}

// ---------- Dayparts ----------
function renderDayparts(el) {
  el.innerHTML = `
    <div class="card">
      <h2>Sales contribution by hour</h2>
      <div class="sub">marts.v_daypart — deck p.9, 29–30. Each row sums to 100% across hours.</div>
      <div class="controls" id="dtCtl">
        <button data-dt="weekday" class="active">Weekday</button>
        <button data-dt="weekend">Weekend</button>
      </div>
      <div id="dpHeat"></div>
    </div>`;
  const heat = el.querySelector('#dpHeat');
  const draw = dt => {
    const data = D.daypart[dt];
    const max = Math.max(...DIMS.BRANCHES.flatMap(b => data[b]));
    heat.innerHTML = `<table class="heat">
      <tr><th>Branch</th>${DIMS.HOURS.map(h => `<th class="num">${h}:00</th>`).join('')}</tr>
      ${DIMS.BRANCHES.map(b => `<tr><td>${b}</td>${data[b].map((v, i) =>
        `<td class="cell" style="background:${heatColor(v, max)};color:${heatInk(v, max)}"
             title="${b} ${DIMS.HOURS[i]}:00 — ${v}% of ${dt} sales">${v}</td>`).join('')}</tr>`).join('')}
    </table>`;
  };
  el.querySelectorAll('#dtCtl button').forEach(b => b.onclick = () => {
    el.querySelectorAll('#dtCtl button').forEach(x => x.classList.toggle('active', x === b));
    draw(b.dataset.dt);
  });
  draw('weekday');
}

// ---------- Menu & Category ----------
function renderMenu(el) {
  const max = Math.max(...D.categoryMix.flatMap(r => r.values));
  el.innerHTML = `
    <div class="card">
      <h2>Category share by channel</h2>
      <div class="sub">marts.v_category_mix — deck p.13. Columns sum to ~100%.</div>
      <table class="heat">
        <tr><th>Category</th>${D.categoryMix.map(r => `<th class="num">${r.channel}</th>`).join('')}</tr>
        ${DIMS.CATEGORIES.map((cat, ci) => `<tr><td>${cat}</td>${D.categoryMix.map(r =>
          `<td class="cell" style="background:${heatColor(r.values[ci], max)};color:${heatInk(r.values[ci], max)}"
               title="${cat} — ${r.values[ci]}% of ${r.channel} sales">${r.values[ci]}%</td>`).join('')}</tr>`).join('')}
      </table>
    </div>
    <div class="card">
      <h2>Top menu items — share of total sales</h2>
      <div class="sub">marts.v_menu_ranking — deck p.14</div>
      <div id="topItems"></div>
    </div>
    <div class="card">
      <h2>Menu engineering</h2>
      <div class="sub">marts.v_menu_engineering — awaiting menu cost file (stars / plowhorses / puzzles / dogs)</div>
    </div>`;
  const host = el.querySelector('#topItems');
  const maxS = D.topItems[0].share;
  host.innerHTML = D.topItems.map(it => `
    <div style="display:flex;align-items:center;gap:10px;margin:6px 0"
         onmousemove="tipOn(event,'<b>${it.sku}</b> ${it.name}<br>${it.share}% of total sales')" onmouseleave="tipOff()">
      <div style="width:44px;color:var(--ink-2);font-size:12px">${it.sku}</div>
      <div style="flex:1;background:var(--grid);border-radius:4px;height:14px;position:relative">
        <div style="width:${100 * it.share / maxS}%;height:14px;border-radius:4px;background:var(--s1)"></div>
      </div>
      <div style="width:52px;text-align:right;font-variant-numeric:tabular-nums">${it.share}%</div>
    </div>`).join('');
}

// ---------- Basket & Add-on ----------
function renderBasket(el) {
  el.innerHTML = `
    <div class="card">
      <h2>Bills by number of main dishes</h2>
      <div class="sub">marts.v_basket_distribution — deck p.19. Main dish = Signature, Noodles, Rice, Gaolao.</div>
      <div id="bkBars"></div>
    </div>
    <div class="card">
      <h2>Add-on attachment by channel</h2>
      <div class="sub">marts.v_addon_attachment — deck p.20–23. Units/bill divides by bills WITH add-on (deck p.21).</div>
      <table>
        <tr><th>Channel</th><th class="num">% bills with add-on</th><th class="num">Add-on units / bill</th><th>Top add-on subcategory</th></tr>
        ${D.attachment.map(a => `<tr><td>${a.channel}</td><td class="num">${a.pctWithAddon}%</td>
          <td class="num">${a.addonPerBill}</td><td>${a.topSub}</td></tr>`).join('')}
      </table>
    </div>`;
  const host = el.querySelector('#bkBars');
  const W = 720, H = 200, P = { l: 40, r: 10, t: 10, b: 26 };
  const max = Math.max(...D.basket.map(b => b.pctBills)) * 1.1;
  const step = (W - P.l - P.r) / D.basket.length, bw = Math.min(48, step - 8);
  let g = '';
  D.basket.forEach((b, i) => {
    const h = (H - P.t - P.b) * b.pctBills / max;
    const cx = P.l + step * i + step / 2;
    g += `<rect x="${cx - bw / 2}" y="${H - P.b - h}" width="${bw}" height="${h}" rx="4" fill="var(--s1)"
            onmousemove="tipOn(event,'${b.bucket} main dish(es) — ${b.pctBills}% of bills')" onmouseleave="tipOff()"/>
          <text x="${cx}" y="${H - 8}" text-anchor="middle">${b.bucket}</text>`;
    if (i < 3) g += `<text class="dl" x="${cx}" y="${H - P.b - h - 5}" text-anchor="middle">${b.pctBills}%</text>`;
  });
  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Bills by main dish count">${g}</svg>
    <div class="sub" style="margin-top:4px">x: main dishes per bill · y: % of all bills</div>`;
}

// ---------- Placeholder ----------
function renderSoon(el) {
  el.innerHTML = `
    <div class="card"><h2>Marketing ROI & Campaigns</h2><div class="sub">Wired to marts.v_marketing_monthly, v_cpo, v_campaign_uplift — activates with the accounting feed (phase 5).</div></div>
    <div class="card"><h2>Social & Content</h2><div class="sub">Wired to marts.v_post_performance, v_content_sales_impact — activates with social API tokens (phase 6).</div></div>
    <div class="card"><h2>Reputation</h2><div class="sub">Wired to marts.v_ratings_trend, v_review_themes — activates with Google/Grab review ingest (phase 6).</div></div>
    <div class="card"><h2>Data health</h2><div class="sub">Wired to ops.ingestion_log + marts.v_unmapped_items (phase 3).</div></div>`;
}
</script>
</body>
</html>
